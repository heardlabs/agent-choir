[project]
name = "agent-choir"
version = "0.1.0"
description = "Your coding agents sing what they just did: a drop-in, bring-your-own-key hook for Claude Code and Codex."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "anthropic>=2.0",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
choir = "choir.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["choir", "choir.providers"]
