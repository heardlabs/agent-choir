[project]
name = "agent-choir"
version = "0.1.0"
description = "Turn what your coding agents did into an a cappella song (and a tweetable video)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
choir = "choir.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["choir", "choir.providers"]
